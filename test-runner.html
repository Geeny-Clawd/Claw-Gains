<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claw Gains - Test Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --text: #e5e5e5;
            --text-muted: #888888;
            --border: #333333;
            --accent: #3b82f6;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
        h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; margin-top: 24px; }
        
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        
        /* Summary Card */
        .summary-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        .summary-stat {
            text-align: center;
        }
        
        .summary-number {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .summary-number.pass { color: var(--success); }
        .summary-number.fail { color: var(--error); }
        .summary-number.total { color: var(--text); }
        
        .summary-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Run Button */
        .run-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .run-btn:hover { filter: brightness(1.1); }
        .run-btn:active { transform: scale(0.98); }
        
        /* Test Results */
        .test-results {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .test-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .test-item.pass {
            border-left: 3px solid var(--success);
        }
        
        .test-item.fail {
            border-left: 3px solid var(--error);
            background: rgba(239, 68, 68, 0.1);
        }
        
        .test-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        
        .test-icon.pass {
            background: var(--success);
            color: white;
        }
        
        .test-icon.fail {
            background: var(--error);
            color: white;
        }
        
        .test-message {
            flex: 1;
        }
        
        .test-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Section Headers */
        .section-header {
            background: #252525;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
        }
        
        /* Failed Tests Summary */
        .failed-summary {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }
        
        .failed-summary.show { display: block; }
        
        .failed-title {
            color: var(--error);
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        /* Browser Console Note */
        .console-note {
            background: #252525;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .console-note code {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
        }
        
        /* Loading State */
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        
        /* Timestamp */
        .timestamp {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: auto;
        }
    </style>
</head>
<body>
    <h1>Claw Gains - Test Runner</h1>
    <p class="subtitle">Automated test suite for the fitness tracker</p>
    
    <div class="summary-card">
        <div class="summary-stat">
            <div class="summary-number total" id="totalCount">0</div>
            <div class="summary-label">Total</div>
        </div>
        <div class="summary-stat">
            <div class="summary-number pass" id="passCount">0</div>
            <div class="summary-label">Passed</div>
        </div>
        <div class="summary-stat">
            <div class="summary-number fail" id="failCount">0</div>
            <div class="summary-label">Failed</div>
        </div>
        <button class="run-btn" onclick="runTests()" id="runBtn">Run All Tests</button>
        <div class="timestamp" id="timestamp"></div>
    </div>
    
    <div class="failed-summary" id="failedSummary">
        <div class="failed-title">⚠️ Failed Tests Need Attention</div>
        <div id="failedList"></div>
    </div>
    
    <div id="resultsContainer"></div>
    
    <div class="console-note">
        <strong>Tip:</strong> You can also run tests from the browser console using <code>runAllTests()</code>.
        The console output includes detailed timing and formatted results.
    </div>

    <script src="tests.js"></script>

            3: { name: 'Lower — Posterior Chain', warmup: [ { name: 'Sled — Backwards', sets: 1, reps: '3 min', targetWeight: null, notes: 'Push for distance' }, { name: 'Elephant Walk', sets: 1, reps: '15 reps/side', targetWeight: null, notes: 'Each side' }, { name: 'Standing Pancake Pulse', sets: 1, reps: '20 reps', targetWeight: null, notes: '' }, { name: 'Glute Bridge', sets: 1, reps: '10 reps, 2 sec hold', targetWeight: null, notes: 'Warm-up' } ], mainA: { weekA: [ { name: 'Romanian Deadlift', sets: 4, reps: '6-8', targetWeight: null, notes: '' }, { name: 'Hip Thrust (Barbell)', sets: 4, reps: '6-10', targetWeight: '100 kg+', notes: 'Target: 100 kg+' }, { name: 'Nordic Curl', sets: 3, reps: '5-8', targetWeight: null, notes: 'Negatives allowed' }, { name: 'Back Extension', sets: 3, reps: '8-12', targetWeight: '18.25 kg', notes: '' } ], weekB: [ { name: 'Romanian Deadlift', sets: 4, reps: '6-8', targetWeight: null, notes: '' }, { name: 'Hip Thrust (Barbell)', sets: 4, reps: '6-10', targetWeight: '100 kg+', notes: 'Target: 100 kg+' }, { name: 'Seated Good Morning', sets: 3, reps: '10', targetWeight: '48 kg', notes: '' }, { name: 'Nordic Curl', sets: 3, reps: '5-8', targetWeight: null, notes: 'Negatives allowed' }, { name: 'Back Extension', sets: 3, reps: '8-12', targetWeight: '18.25 kg', notes: '' } ] }, calfTibialis: [ { name: 'Straight-Leg Calf Raise', sets: 3, reps: '12 each leg', targetWeight: '18.25 kg', notes: 'Each leg' }, { name: 'Tibialis Raise', sets: 3, reps: '15-20', targetWeight: '14.5 kg', notes: '' }, { name: 'Bent Calf Raise (seated)', sets: 3, reps: '15', targetWeight: '18.25 kg', notes: 'Week B only', isWeekB: true } ], accessories: [ { name: 'Lying Leg Curl', sets: 3, reps: '10-12', targetWeight: null, notes: '' } ], shoulderHealth: [], extra: [ { name: 'Couch Stretch', sets: 1, reps: '45 sec/side', targetWeight: null, notes: 'Each side' } ] },
            4: { name: 'Upper Pull', warmup: [ { name: 'Sled — Backwards', sets: 1, reps: '3 min', targetWeight: null, notes: 'Push for distance' }, { name: "Butcher's Block Stretch", sets: 1, reps: '1 min', targetWeight: null, notes: '' }, { name: 'Band Pull-Apart', sets: 1, reps: '15 reps', targetWeight: null, notes: '' }, { name: 'Ring Row/Light Cable Row', sets: 1, reps: '10 reps', targetWeight: null, notes: 'Warm-up' } ], mainA: { weekA: [ { name: 'Pull-Up', sets: 4, reps: '4-8', targetWeight: '10 reps bodyweight', notes: 'Target: 10 reps bodyweight' }, { name: 'Barbell Row', sets: 4, reps: '6-8', targetWeight: null, notes: '' }, { name: 'Lat Pulldown', sets: 3, reps: '8-12', targetWeight: null, notes: '' }, { name: 'Pullover', sets: 3, reps: '10', targetWeight: '18.25 kg', notes: '' } ], weekB: [ { name: 'Pull-Up', sets: 4, reps: '4-8', targetWeight: '10 reps bodyweight', notes: 'Target: 10 reps bodyweight' }, { name: 'Chest-Supported Row', sets: 4, reps: '6-8', targetWeight: null, notes: '' }, { name: 'Seated Cable Row', sets: 3, reps: '10-12', targetWeight: null, notes: '' }, { name: 'Pullover', sets: 3, reps: '10', targetWeight: '18.25 kg', notes: '' } ] }, accessories: [ { name: 'Face Pull', sets: 3, reps: '12-15', targetWeight: null, notes: 'Superset with bicep curl' }, { name: 'Barbell/Dumbbell Curl', sets: 3, reps: '8-12', targetWeight: null, notes: 'Superset with face pull' }, { name: 'External Rotation', sets: 3, reps: '8 each arm', targetWeight: '7.25 kg', notes: 'Each arm' }, { name: 'Trap 3 Raise', sets: 3, reps: '8', targetWeight: null, notes: '' } ], shoulderHealth: [], extra: [ { name: 'Straight-Arm Pulldown', sets: 2, reps: '12-15', targetWeight: null, notes: '' }, { name: 'Scott Curl', sets: 2, reps: '10-12', targetWeight: null, notes: '' }, { name: 'Rear Delt Flye', sets: 2, reps: '15', targetWeight: null, notes: '' } ] },
            5: { name: 'Arms, Shoulders & Mobility', warmup: [ { name: 'Sled — Backwards', sets: 1, reps: '3 min', targetWeight: null, notes: 'Push for distance' }, { name: 'Shoulder Circles', sets: 1, reps: '20 each', targetWeight: null, notes: 'Each direction' }, { name: 'Band Pull-Apart', sets: 1, reps: '15 reps', targetWeight: null, notes: '' }, { name: 'Light DB Press', sets: 1, reps: '10 reps', targetWeight: null, notes: 'Warm-up' } ], mainA: { weekA: [ { name: 'Seated Dumbbell Press', sets: 3, reps: '8-10', targetWeight: null, notes: '' }, { name: 'Lateral Raise', sets: 3, reps: '12-15', targetWeight: null, notes: '' }, { name: 'Rear Delt Flye', sets: 3, reps: '12-15', targetWeight: null, notes: '' } ], weekB: [ { name: 'ATG Shoulder Press DB', sets: 3, reps: '10', targetWeight: '18.25 kg/hand', notes: 'Standing, each arm' }, { name: 'Lateral Raise', sets: 3, reps: '12-15', targetWeight: null, notes: '' }, { name: 'Face Pull', sets: 3, reps: '12-15', targetWeight: null, notes: '' } ] }, accessories: [ { name: 'Scott Curl (preacher)', sets: 3, reps: '10', targetWeight: null, notes: 'Superset 1 with French Press' }, { name: 'French Press', sets: 3, reps: '10', targetWeight: null, notes: 'Superset 1' }, { name: 'Scott Curl (different grip)', sets: 3, reps: '10-12', targetWeight: null, notes: 'Superset 2 with tricep pushdown' }, { name: 'Tricep Pushdown (rope)', sets: 3, reps: '12-15', targetWeight: null, notes: 'Superset 2' } ], shoulderHealth: [ { name: 'Powell Raise', sets: 2, reps: '10 each side', targetWeight: '7.25 kg', notes: 'Each side' }, { name: 'External Rotation', sets: 2, reps: '12 each arm', targetWeight: '7.25 kg', notes: 'Each arm' } ], neck: [ { name: 'Neck Flexion', sets: 3, reps: '10', targetWeight: '7.25 kg', notes: '' } ], flexibility: [ { name: 'Jefferson Curl', sets: 2, reps: '10', targetWeight: '14.5 kg', notes: '' }, { name: 'Butterfly (weighted)', sets: 3, reps: '20', targetWeight: '8.75 kg', notes: '' }, { name: 'Standing Pancake Pulse'         // Make programData global for tests
        window.programData = programData;
        
        function runTests() {
            const btn = document.getElementById('runBtn');
            btn.textContent = 'Running...';
            btn.classList.add('loading');
            
            // Run tests
            setTimeout(() => {
                runAllTests();
                displayResults();
                btn.textContent = 'Run All Tests';
                btn.classList.remove('loading');
            }, 100);
        }
        
        function displayResults() {
            const results = TestRunner.getResults();
            const summary = TestRunner.getSummary();
            
            // Update summary
            document.getElementById('totalCount').textContent = summary.total;
            document.getElementById('passCount').textContent = summary.passed;
            document.getElementById('failCount').textContent = summary.failed;
            document.getElementById('timestamp').textContent = new Date().toLocaleTimeString();
            
            // Update failed summary
            const failedSummary = document.getElementById('failedSummary');
            const failedList = document.getElementById('failedList');
            
            if (summary.failed > 0) {
                failedSummary.classList.add('show');
                failedList.innerHTML = summary.failed + ' test(s) failed. Check the results below.';
            } else {
                failedSummary.classList.remove('show');
            }
            
            // Display results
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="test-results"></div>';
            const resultsDiv = container.querySelector('.test-results');
            
            // Group results by category
            const categories = {
                'Program Data Structure': [],
                'Week Toggle Functionality': [],
                'Day Navigation': [],
                'Cycle Progression': [],
                'Data Persistence': [],
                'Exercise Rendering': [],
                'Set Completion': [],
                'Weight Input & Progression': [],
                'History Display': [],
                'Edge Cases': []
            };
            
            results.forEach((result, index) => {
                const category = getCategoryForTest(index);
                categories[category].push(result);
            });
            
            // Render grouped results
            Object.entries(categories).forEach(([category, tests]) => {
                if (tests.length > 0) {
                    const header = document.createElement('div');
                    header.className = 'section-header';
                    header.textContent = category + ' (' + tests.filter(t => t.passed).length + '/' + tests.length + ')';
                    resultsDiv.appendChild(header);
                    
                    tests.forEach(result => {
                        const item = document.createElement('div');
                        item.className = 'test-item ' + (result.passed ? 'pass' : 'fail');
                        item.innerHTML = `
                            <div class="test-icon ${result.passed ? 'pass' : 'fail'}">${result.passed ? '✓' : '✗'}</div>
                            <div class="test-message">${result.message}</div>
                        `;
                        resultsDiv.appendChild(item);
                    });
                }
            });
        }
        
        function getCategoryForTest(index) {
            const categories = [
                'Program Data Structure', 'Program Data Structure', 'Program Data Structure', 'Program Data Structure',
                'Program Data Structure', 'Program Data Structure', 'Program Data Structure', 'Program Data Structure',
                'Program Data Structure', 'Program Data Structure', 'Program Data Structure', 'Program Data Structure',
                'Week Toggle Functionality', 'Week Toggle Functionality', 'Week Toggle Functionality',
                'Week Toggle Functionality', 'Week Toggle Functionality',
                'Day Navigation', 'Day Navigation', 'Day Navigation', 'Day Navigation',
                'Cycle Progression', 'Cycle Progression', 'Cycle Progression', 'Cycle Progression',
                'Data Persistence', 'Data Persistence', 'Data Persistence', 'Data Persistence', 'Data Persistence',
                'Exercise Rendering', 'Exercise Rendering', 'Exercise Rendering', 'Exercise Rendering',
                'Exercise Rendering', 'Exercise Rendering', 'Exercise Rendering', 'Exercise Rendering',
                'Set Completion', 'Set Completion', 'Set Completion', 'Set Completion',
                'Weight Input & Progression', 'Weight Input & Progression', 'Weight Input & Progression',
                'Weight Input & Progression', 'Weight Input & Progression', 'Weight Input & Progression',
                'Weight Input & Progression', 'Weight Input & Progression',
                'History Display', 'History Display', 'History Display', 'History Display',
                'Edge Cases', 'Edge Cases', 'Edge Cases', 'Edge Cases', 'Edge Cases',
                'Edge Cases', 'Edge Cases', 'Edge Cases', 'Edge Cases'
            ];
            return categories[index] || 'Other';
        }
        
        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
