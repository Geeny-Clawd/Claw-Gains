<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claw Gains - Strength Tracker</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --card: #1c1c1e;
            --card-hover: #2c2c2e;
            --text: #f5f5f7;
            --text-secondary: #8e8e93;
            --text-muted: #636366;
            --accent: #0a84ff;
            --accent-glow: rgba(10, 132, 255, 0.3);
            --week-a: #0a84ff;
            --week-b: #ff9f0a;
            --success: #30d158;
            --success-glow: rgba(48, 209, 88, 0.3);
            --danger: #ff453a;
            --input-bg: #2c2c2e;
            --input-border: #3a3a3c;
            --input-focus: #0a84ff;
            --divider: #38383a;
            --shadow: rgba(0, 0, 0, 0.4);
            --shadow-glow: rgba(10, 132, 255, 0.15);
        }

        @font-face {
            font-family: 'SF Pro';
            src: local('SF Pro Display'), local('-apple-system'), local('BlinkMacSystemFont');
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 0;
            max-width: 100%;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        .header {
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 20px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .finish-btn {
            background: linear-gradient(135deg, var(--success) 0%, #28a745 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px var(--success-glow);
        }
        .finish-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--success-glow);
        }
        .finish-btn:active {
            transform: translateY(0);
        }

        /* Timer Bar */
        .timer-bar {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timer-display {
            font-variant-numeric: tabular-nums;
            font-size: 1.5rem;
            font-weight: 700;
            min-width: 70px;
            color: var(--text);
            font-feature-settings: "tnum";
        }
        .timer-btn {
            background: var(--card);
            border: 1px solid var(--divider);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }
        .timer-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--shadow-glow);
        }

        /* Week Toggle */
        .week-toggle {
            display: flex;
            gap: 6px;
            margin: 16px 20px 12px;
            background: var(--card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--divider);
        }
        .week-btn {
            flex: 1;
            padding:16px;
            10px  border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }
        .week-btn.active.week-a {
            background: linear-gradient(135deg, var(--week-a) 0%, #0066cc 100%);
            color: white;
            box-shadow: 0 4px 12px var(--shadow-glow);
        }
        .week-btn.active.week-b {
            background: linear-gradient(135deg, var(--week-b) 0%, #e08900 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 159, 10, 0.2);
        }
        .week-btn:hover:not(.active) {
            background: var(--card-hover);
            color: var(--text);
        }

        /* Day Navigation */
        .day-nav {
            display: flex;
            gap: 8px;
            margin: 0 20px 16px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .day-nav::-webkit-scrollbar { display: none; }
        .day-btn {
            padding: 10px 16px;
            border: 1px solid var(--divider);
            border-radius: 10px;
            background: var(--card);
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-secondary);
        }
        .day-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }
        .day-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, #0066cc 100%);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--shadow-glow);
        }
        .day-btn.completed {
            border-color: var(--success);
            background: rgba(48, 209, 88, 0.1);
            color: var(--success);
        }
        .day-btn.completed:hover {
            background: rgba(48, 209, 88, 0.2);
        }

        /* Workout content container */
        #workoutContent {
            display: flex;
            flex-direction: column;
            padding-bottom: 24px;
        }
        #workoutContent h2 {
            margin: 8px 20px 16px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        /* Exercise Card */
        .group-card {
            background: var(--card);
            border: 1px solid var(--divider);
            border-radius: 16px;
            margin: 0 20px 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .group-card:hover {
            border-color: #48484a;
        }
        .group-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .group-header h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .exercise-icons { display: flex; gap: 14px; }
        .exercise-icons svg {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .exercise-icons svg:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        /* Exercise rows within section card */
        .exercise-row {
            padding: 16px 18px;
            border-bottom: 1px solid var(--divider);
            transition: background 0.2s ease;
        }
        .exercise-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .exercise-row:last-child { border-bottom: none; }
        .exercise-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .exercise-info .exercise-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .exercise-info .exercise-target {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Sets Table */
        .sets-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 4px;
        }
        .sets-table th {
            padding: 8px 6px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
        }
        .sets-table th.set-col { width: 32px; }
        .sets-table th.prev-col { width: 60px; }
        .sets-table th.kg-col { width: 60px; }
        .sets-table th.reps-col { width: 60px; }
        .sets-table th.check-col { width: 36px; }
        .sets-table th.remove-col { width: 32px; }

        .sets-table tbody tr {
            background: var(--input-bg);
            transition: all 0.2s ease;
        }
        .sets-table tbody tr:hover {
            background: var(--card-hover);
        }
        .sets-table td {
            padding: 8px 6px;
            text-align: center;
        }
        .sets-table td:first-child { border-radius: 8px 0 0 8px; }
        .sets-table td:last-child { border-radius: 0 8px 8px 0; }
        .set-num {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .prev-val {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .kg-input, .reps-input {
            width: 100%;
            padding: 10px 8px;
            border: 1px solid transparent;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            background: var(--card);
            color: var(--text);
            transition: all 0.2s ease;
        }
        .kg-input:focus, .reps-input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--shadow-glow);
        }
        .kg-input::placeholder, .reps-input::placeholder {
            color: var(--text-muted);
        }

        .check-btn {
            width: 26px;
            height: 26px;
            border: 2px solid var(--divider);
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0 auto;
            background: transparent;
        }
        .check-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--shadow-glow);
        }
        .check-btn.checked {
            background: linear-gradient(135deg, var(--success) 0%, #28a745 100%);
            border-color: var(--success);
            box-shadow: 0 4px 12px var(--success-glow);
        }
        .check-btn svg {
            width: 14px;
            height: 14px;
            display: none;
            transition: all 0.2s ease;
        }
        .check-btn.checked svg {
            display: block;
            color: white;
        }

        .add-set-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
        }
        .add-set-btn:hover {
            background: rgba(10, 132, 255, 0.1);
        }

        .remove-set-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 6px;
            transition: all 0.2s ease;
            opacity: 0.6;
        }
        .remove-set-btn:hover {
            color: var(--danger);
            opacity: 1;
        }

        /* Mark Done Button */
        .mark-done-btn {
            margin: 24px 20px;
            padding: 16px 24px;
            background: var(--card);
            border: 1px solid var(--divider);
            border-radius: 14px;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            width: calc(100% - 40px);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
        }
        .mark-done-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 4px 16px var(--shadow-glow);
            transform: translateY(-2px);
        }
        .mark-done-btn.done {
            background: linear-gradient(135deg, var(--success) 0%, #28a745 100%);
            border-color: var(--success);
            color: white;
            box-shadow: 0 4px 16px var(--success-glow);
        }
        .mark-done-btn.done:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--success-glow);
        }

        /* History */
        .history-section {
            margin: 20px;
            padding: 18px;
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--divider);
        }
        .history-section h2 {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--divider);
        }
        .history-item:last-child { border-bottom: none; }
        .history-date {
            font-weight: 600;
            color: var(--text);
        }
        .history-val {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Week Complete Banner */
        .week-complete-banner {
            margin: 20px;
            padding: 24px;
            background: linear-gradient(135deg, var(--accent) 0%, #5a4bff 100%);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 32px var(--shadow-glow);
        }
        .week-complete-banner h3 {
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .week-complete-banner p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
            margin-bottom: 16px;
        }
        .week-complete-banner button {
            background: white;
            color: var(--accent);
            border: none;
            padding: 12px 28px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .week-complete-banner button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 200;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--divider);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px var(--shadow);
        }
        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--divider);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text);
            transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--shadow-glow);
        }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
        .modal-btn {
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .modal-btn.secondary {
            background: var(--card);
            border: 1px solid var(--divider);
            color: var(--text);
        }
        .modal-btn.secondary:hover {
            border-color: var(--text-muted);
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, var(--accent) 0%, #0066cc 100%);
            color: white;
            border: none;
        }
        .modal-btn.primary:hover {
            box-shadow: 0 4px 12px var(--shadow-glow);
            transform: translateY(-1px);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .group-card {
            animation: fadeIn 0.4s ease forwards;
        }
        .group-card:nth-child(1) { animation-delay: 0.05s; }
        .group-card:nth-child(2) { animation-delay: 0.1s; }
        .group-card:nth-child(3) { animation-delay: 0.15s; }
        .group-card:nth-child(4) { animation-delay: 0.2s; }
        .group-card:nth-child(5) { animation-delay: 0.25s; }
        .group-card:nth-child(6) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <span class="header-title">Claw Gains</span>
        <button class="finish-btn" onclick="finishWorkout()">Finish</button>
    </div>
    
    <!-- Timer Bar -->
    <div class="timer-bar">
        <span class="timer-display" id="restTimer">0:00</span>
        <button class="timer-btn" onclick="startRest(60)">60s</button>
        <button class="timer-btn" onclick="startRest(90)">90s</button>
        <button class="timer-btn" onclick="startRest(120)">2m</button>
        <button class="timer-btn" onclick="stopRest()">Stop</button>
    </div>
    
    <!-- Main View -->
    <div id="mainView">
        <!-- Week Toggle -->
        <div class="week-toggle">
            <button class="week-btn week-a active" id="weekABtn" onclick="setWeek('A')">Week A</button>
            <button class="week-btn week-b" id="weekBBtn" onclick="setWeek('B')">Week B</button>
        </div>
        
        <!-- Day Navigation -->
        <div class="day-nav" id="dayNav"></div>
        
        <!-- Workout Content -->
        <div id="workoutContent"></div>
    </div>

                ],

                ]
            },
            3: { // Day 3: Lower - Posterior Chain
                name: 'Lower — Posterior Chain',
                warmup: [
                    { name: 'Sled — Backwards', sets: 1, reps: '3 min', targetWeight: null},
                    { name: 'Elephant Walk', sets: 1, reps: '15 reps/side', targetWeight: null},
                    { name: 'Standing Pancake Pulse', sets: 1, reps: '20 reps', targetWeight: null},
                    { name: 'Glute Bridge', sets: 1, reps: '10 reps, 2 sec hold', targetWeight: null}
                ],
