<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claw Gains - Strength Tracker</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --card: #1c1c1e;
            --card-hover: #2c2c2e;
            --text: #f5f5f7;
            --text-secondary: #8e8e93;
            --text-muted: #636366;
            --accent: #0a84ff;
            --week-a: #0a84ff;
            --week-b: #ff9f0a;
            --success: #30d158;
            --danger: #ff453a;
            --input-bg: #2c2c2e;
            --input-border: #3a3a3c;
            --divider: #38383a;
            --shadow: rgba(0, 0, 0, 0.4);
            --shadow-glow: rgba(10, 132, 255, 0.15);
            --success-glow: rgba(48, 209, 88, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 0;
            max-width: 100%;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: var(--card);
            padding: 12px 16px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .finish-btn {
            background: linear-gradient(135deg, var(--success) 0%, #28a745 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .finish-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--success-glow);
        }

        /* Timer Bar */
        .timer-bar {
            background: var(--card);
            padding: 10px 16px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .timer-display {
            font-variant-numeric: tabular-nums;
            font-size: 1.5rem;
            font-weight: 700;
            min-width: 70px;
        }
        .timer-btn {
            background: var(--card);
            border: 1px solid var(--divider);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }
        .timer-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Week Toggle */
        .week-toggle {
            display: flex;
            gap: 6px;
            margin: 12px 16px 10px;
            background: var(--card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--divider);
        }
        .week-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
            color: var(--text-secondary);
        }
        .week-btn.active.week-a {
            background: linear-gradient(135deg, var(--week-a) 0%, #0066cc 100%);
            color: white;
        }
        .week-btn.active.week-b {
            background: linear-gradient(135deg, var(--week-b) 0%, #e08900 100%);
            color: white;
        }
        .week-btn:hover:not(.active) {
            background: var(--card-hover);
            color: var(--text);
        }

        /* Day Navigation */
        .day-nav {
            display: flex;
            gap: 6px;
            margin: 0 16px 12px;
            overflow-x: auto;
            padding: 4px 0;
        }
        .day-nav::-webkit-scrollbar { display: none; }
        .day-btn {
            padding: 10px 16px;
            border: 1px solid var(--divider);
            border-radius: 10px;
            background: var(--card);
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.25s ease;
            color: var(--text-secondary);
        }
        .day-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .day-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, #0066cc 100%);
            color: white;
            border-color: var(--accent);
        }
        .day-btn.completed {
            border-color: var(--success);
            background: rgba(48, 209, 88, 0.1);
            color: var(--success);
        }
        /* Active always beats completed — position trumps status */
        .day-btn.active.completed {
            background: linear-gradient(135deg, var(--accent) 0%, #0066cc 100%);
            color: white;
            border-color: var(--accent);
        }

        /* Workout Content */
        #workoutContent {
            display: flex;
            flex-direction: column;
            padding-bottom: 24px;
        }
        #workoutContent h2 {
            margin: 12px 16px 10px;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        /* Exercise Card - Edge to edge with gap to show background */
        .group-card {
            background: var(--card);
            border-top: 1px solid var(--divider);
            padding: 12px 16px;
            margin-top: -1px;
        }
        .group-card:last-child { border-bottom: 1px solid var(--divider); }
        .group-card + .group-card { margin-top: 8px; }
        .group-header {
            padding: 10px 0;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .group-header h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Exercise Row */
        .exercise-row {
            padding: 10px 0;
            border-bottom: 1px solid var(--divider);
        }
        .exercise-row:last-child { border-bottom: none; }
        .exercise-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 12px;
        }
        .exercise-info-left {
            flex: 1;
        }
        .exercise-info .exercise-name {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.01em;
            display: block;
        }
        .exercise-info .exercise-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            display: block;
            margin-top: 2px;
        }
        .exercise-info .exercise-target {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Sets Table */
        .sets-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 2px;
        }
        .sets-table th {
            padding: 6px 4px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
        }
        .sets-table th.set-col { width: 28px; }
        .sets-table th.prev-col { width: 50px; }
        .sets-table th.kg-col { width: 50px; }
        .sets-table th.reps-col { width: 50px; }
        .sets-table th.check-col { width: 32px; text-align: right; }
        .sets-table th.remove-col { width: 28px; }

        .sets-table tbody tr { background: var(--input-bg); }
        .sets-table td {
            padding: 6px 4px;
            text-align: center;
        }
        .sets-table td:first-child { border-radius: 6px 0 0 6px; }
        .sets-table td:last-child { border-radius: 0 6px 6px 0; }
        .sets-table td.check-col { text-align: right; border-radius: 0 6px 6px 0; padding-right: 6px; }
        .set-num { font-size: 0.7rem; color: var(--text-muted); }
        .prev-val { font-size: 0.65rem; color: var(--text-secondary); }

        .kg-input, .reps-input {
            width: 100%;
            padding: 8px 4px;
            border: 1px solid transparent;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--card);
            color: var(--text);
        }
        .kg-input:focus, .reps-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .kg-input::placeholder, .reps-input::placeholder {
            color: var(--text-muted);
            opacity: 0.45;
        }

        .check-btn {
            width: 24px;
            height: 24px;
            border: 2px solid var(--divider);
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            margin: 0 auto;
            background: transparent;
        }
        .check-btn:hover { border-color: var(--accent); }
        .check-btn.checked {
            background: linear-gradient(135deg, var(--success) 0%, #28a745 100%);
            border-color: var(--success);
        }
        .check-btn svg { width: 14px; height: 14px; display: none; }
        .check-btn.checked svg { display: block; color: white; }

        .add-set-btn {
            width: 100%;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .add-set-btn:hover { background: rgba(10, 132, 255, 0.1); }

        .remove-set-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 4px;
        }
        .remove-set-btn:hover { color: var(--danger); }

        /* Mark Done Button */
        .mark-done-btn {
            margin: 12px 0;
            padding: 14px 16px;
            background: var(--card);
            border-top: 1px solid var(--divider);
            border-bottom: 1px solid var(--divider);
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }
        .mark-done-btn:hover { border-color: var(--accent); color: var(--accent); }
        .mark-done-btn.done {
            background: linear-gradient(135deg, var(--success) 0%, #28a745 100%);
            border-color: var(--success);
            color: white;
        }

        /* History */
        .history-section {
            margin: 12px 0;
            padding: 14px 16px;
            background: var(--card);
            border-top: 1px solid var(--divider);
            border-bottom: 1px solid var(--divider);
        }
        .history-section h2 {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--divider);
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: 600; }
        .history-val { color: var(--text-secondary); }

        /* Week Complete Banner */
        .week-complete-banner {
            margin: 12px 0;
            padding: 24px 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #5a4bff 100%);
            text-align: center;
        }
        .week-complete-banner h3 { color: white; font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
        .week-complete-banner p { color: rgba(255,255,255,0.8); font-size: 0.875rem; margin-bottom: 16px; }
        .week-complete-banner button {
            background: white;
            color: var(--accent);
            border: none;
            padding: 12px 28px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 200;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--divider);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }
        .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-secondary); font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--divider);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text);
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
        .modal-btn {
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .modal-btn.secondary { background: var(--card); border: 1px solid var(--divider); color: var(--text); }
        .modal-btn.primary { background: linear-gradient(135deg, var(--accent) 0%, #0066cc 100%); color: white; border: none; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .group-card { animation: fadeIn 0.4s ease forwards; }
        .group-card:nth-child(1) { animation-delay: 0.05s; }
        .group-card:nth-child(2) { animation-delay: 0.1s; }
        .group-card:nth-child(3) { animation-delay: 0.15s; }
        .group-card:nth-child(4) { animation-delay: 0.2s; }
        .group-card:nth-child(5) { animation-delay: 0.25s; }
        .group-card:nth-child(6) { animation-delay: 0.3s; }

        /* Notes */
        .day-note-area {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--divider);
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text);
            resize: vertical;
            min-height: 38px;
            max-height: 120px;
        }
        .day-note-area:focus { outline: none; border-color: var(--accent); }
        .day-note-area::placeholder { color: var(--text-muted); }
        .day-note-wrap { margin: 0 16px 8px; }

        .exercise-note-input {
            width: 100%;
            padding: 4px 0;
            border: none;
            border-bottom: 1px solid transparent;
            font-size: 0.75rem;
            font-family: inherit;
            background: transparent;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .exercise-note-input:focus { outline: none; border-bottom-color: var(--accent); }
        .exercise-note-input::placeholder { color: var(--text-muted); font-style: italic; }
        .exercise-note-input.inherited { color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { h, render } from 'https://esm.sh/preact@10.25.4';
        import { useState, useEffect, useRef, useCallback, useMemo } from 'https://esm.sh/preact@10.25.4/hooks';
        import { signal, computed } from 'https://esm.sh/@preact/signals@1.3.1?deps=preact@10.25.4';
        import htm from 'https://esm.sh/htm@3.1.1';

        const html = htm.bind(h);

        // ── Signals ──────────────────────────────────────────────────

        const defaultState = {
            currentCycle: 1,
            currentDay: 1,
            currentWeek: 'A',
            dayCompletion: {},
            exerciseLogs: {},
            dayNotes: {},
            exerciseNotes: {}
        };

        function loadState() {
            const saved = localStorage.getItem('clawgains_state');
            if (saved) return { ...defaultState, ...JSON.parse(saved) };
            return { ...defaultState };
        }

        const appState = signal(loadState());
        const timerRemaining = signal(0);
        const programData = signal(null);
        const historyCache = signal(null);

        // ── Persistence ──────────────────────────────────────────────

        function persistAndSync() {
            historyCache.value = null;
            localStorage.setItem('clawgains_state', JSON.stringify(appState.value));
            debouncedSync();
        }

        function mutateState(fn) {
            fn(appState.value);
            appState.value = { ...appState.value };
            persistAndSync();
        }

        let syncTimer = null;
        function debouncedSync() {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(syncToServer, 2000);
        }

        function invariant(condition, message) {
            if (!condition) throw new Error(message);
        }

        function getWeekKey(week) {
            invariant(week === 'A' || week === 'B', `Unexpected week value: ${week}`);
            return `week${week}`;
        }

        function getMainExercisesForWeek(dayData, week, context = 'unknown') {
            invariant(dayData && typeof dayData === 'object', `[${context}] Missing day data`);
            invariant(dayData.mainA && typeof dayData.mainA === 'object', `[${context}] Missing mainA block`);
            const weekKey = getWeekKey(week);
            const exercises = dayData.mainA[weekKey];
            invariant(Array.isArray(exercises), `[${context}] Missing/invalid exercises for ${weekKey}`);
            return exercises;
        }

        function getSectionForExercise(dayNum, exerciseName) {
            const pd = programData.value;
            invariant(pd && typeof pd === 'object', 'Program data not loaded');
            const dayData = pd[dayNum];
            invariant(dayData, `Missing day ${dayNum} in program data`);
            const week = appState.value.currentWeek;
            const sectionMap = {
                warmup: dayData.warmup || [],
                mainA: getMainExercisesForWeek(dayData, week, `getSectionForExercise day=${dayNum}`),
                prehab: dayData.prehab || [],
                accessories: dayData.accessories || [],
                shoulderHealth: dayData.shoulderHealth || [],
                calfTibialis: dayData.calfTibialis || [],
                neck: dayData.neck || [],
                flexibility: dayData.flexibility || [],
                extra: dayData.extra || []
            };
            for (const [section, exercises] of Object.entries(sectionMap)) {
                if (exercises.some(ex => ex.name === exerciseName)) return section;
            }
            throw new Error(`Exercise not found in program sections (day=${dayNum}, week=${week}): ${exerciseName}`);
        }

        function syncToServer() {
            const pd = programData.value;
            if (!pd) return;
            const st = appState.value;
            const { currentCycle: cycle, currentWeek: week, currentDay: day } = st;
            const logs = st.exerciseLogs[cycle]?.[week]?.[day] || {};
            const isDone = st.dayCompletion[cycle]?.[week]?.[day];
            const dayNote = (st.dayNotes && st.dayNotes[cycle]?.[week]?.[day]) || null;

            const exercises = [];
            for (const [name, sets] of Object.entries(logs)) {
                const exNote = (st.exerciseNotes && st.exerciseNotes[cycle]?.[week]?.[day]?.[name]) || null;
                exercises.push({
                    name,
                    section: getSectionForExercise(day, name),
                    note: exNote,
                    sets: sets.map((s, i) => ({
                        set_num: i + 1,
                        weight: s.weight || null,
                        reps: s.reps || null,
                        done: !!s.done
                    }))
                });
            }

            const payload = {
                cycle, week, day,
                day_note: dayNote,
                completed_at: isDone ? new Date().toISOString() : null,
                exercises
            };

            fetch('/api/workout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        // ── Audio ────────────────────────────────────────────────────

        let audioContext = null;
        function playTimerBeep() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const duration = 0.15;
            const frequency = 880;
            for (let i = 0; i < 3; i++) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                const startTime = audioContext.currentTime + (i * 0.25);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            }
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200, 100, 200]);
            }
        }

        // ── History helpers ──────────────────────────────────────────

        function getAllHistory() {
            if (historyCache.value) return historyCache.value;
            const history = {};
            const logs = appState.value.exerciseLogs || {};
            for (const [cycle, cycleData] of Object.entries(logs)) {
                for (const [week, weekData] of Object.entries(cycleData)) {
                    for (const [day, dayData] of Object.entries(weekData)) {
                        for (const [exName, exLogs] of Object.entries(dayData)) {
                            for (const log of exLogs) {
                                if (log.done && log.weight > 0) {
                                    if (!history[exName]) history[exName] = [];
                                    history[exName].push({
                                        cycle: parseInt(cycle),
                                        week,
                                        weight: log.weight,
                                        reps: log.reps
                                    });
                                }
                            }
                        }
                    }
                }
            }
            historyCache.value = history;
            return history;
        }

        function getPreviousWorkoutSets(exerciseName) {
            const st = appState.value;
            const { currentCycle, currentWeek, currentDay } = st;
            const logs = st.exerciseLogs || {};
            let sessions = [];
            for (const [c, cycleData] of Object.entries(logs)) {
                for (const [w, weekData] of Object.entries(cycleData)) {
                    for (const [d, dayData] of Object.entries(weekData)) {
                        if (+c === currentCycle && w === currentWeek && +d === currentDay) continue;
                        const exLogs = dayData[exerciseName];
                        if (exLogs && exLogs.some(log => log.done && log.weight > 0)) {
                            sessions.push({ cycle: +c, week: w, day: +d, sets: exLogs });
                        }
                    }
                }
            }
            if (sessions.length === 0) return null;
            sessions.sort((a, b) => {
                if (a.cycle !== b.cycle) return a.cycle - b.cycle;
                if (a.week !== b.week) return a.week < b.week ? -1 : 1;
                return a.day - b.day;
            });
            return sessions[sessions.length - 1].sets;
        }

        function getLastExerciseNote(exerciseName) {
            const st = appState.value;
            const notes = st.exerciseNotes || {};
            const { currentCycle, currentWeek, currentDay } = st;
            let candidates = [];
            for (const [c, cycleData] of Object.entries(notes)) {
                for (const [w, weekData] of Object.entries(cycleData)) {
                    for (const [d, dayData] of Object.entries(weekData)) {
                        const note = dayData[exerciseName];
                        if (note && note.trim()) {
                            if (+c === currentCycle && w === currentWeek && +d === currentDay) continue;
                            candidates.push({ cycle: +c, week: w, day: +d, note });
                        }
                    }
                }
            }
            candidates.sort((a, b) =>
                a.cycle !== b.cycle ? a.cycle - b.cycle :
                a.week !== b.week ? (a.week === 'A' ? -1 : 1) :
                a.day - b.day
            );
            return candidates.length > 0 ? candidates[candidates.length - 1].note : null;
        }

        // ── State helpers ────────────────────────────────────────────

        function getExerciseLogs(st, ensureExists = false) {
            if (!st.exerciseLogs[st.currentCycle]) {
                if (!ensureExists) return null;
                st.exerciseLogs[st.currentCycle] = {};
            }
            if (!st.exerciseLogs[st.currentCycle][st.currentWeek]) {
                if (!ensureExists) return null;
                st.exerciseLogs[st.currentCycle][st.currentWeek] = {};
            }
            if (!st.exerciseLogs[st.currentCycle][st.currentWeek][st.currentDay]) {
                if (!ensureExists) return null;
                st.exerciseLogs[st.currentCycle][st.currentWeek][st.currentDay] = {};
            }
            return st.exerciseLogs[st.currentCycle][st.currentWeek][st.currentDay];
        }

        // ── Actions ──────────────────────────────────────────────────

        function toggleSet(exerciseName, setNum, event) {
            const row = event.target.closest('tr');
            const kgInput = row.querySelector('.kg-input');
            const repsInput = row.querySelector('.reps-input');
            const rawWeight = kgInput?.value?.trim() || '';
            const rawReps = repsInput?.value?.trim() || '';

            // Compute ghost fallback from state (previous completed set or last workout)
            let ghostWeight = 0, ghostReps = '';
            if (rawWeight === '' || rawReps === '') {
                const st = appState.value;
                const dayLogs = st.exerciseLogs[st.currentCycle]?.[st.currentWeek]?.[st.currentDay]?.[exerciseName] || [];
                for (let i = setNum - 2; i >= 0; i--) {
                    const prev = dayLogs[i];
                    if (prev && (prev.weight > 0 || prev.reps || prev.done)) {
                        ghostWeight = prev.weight || 0;
                        ghostReps = prev.reps || '';
                        break;
                    }
                }
                if (ghostWeight === 0 && ghostReps === '') {
                    const prevSets = getPreviousWorkoutSets(exerciseName);
                    const prevSet = prevSets?.[setNum - 1];
                    const fallback = (prevSet && prevSet.weight > 0) ? prevSet : prevSets?.find(s => s && s.weight > 0);
                    if (fallback) { ghostWeight = fallback.weight || 0; ghostReps = fallback.reps || ''; }
                }
            }

            const weight = rawWeight !== '' ? (parseFloat(rawWeight) || 0) : ghostWeight;
            const reps = rawReps !== '' ? rawReps : ghostReps;

            mutateState(st => {
                const dayLogs = getExerciseLogs(st, true);
                if (!dayLogs[exerciseName]) dayLogs[exerciseName] = [];
                while (dayLogs[exerciseName].length < setNum) {
                    dayLogs[exerciseName].push({ weight: 0, reps: '', done: false });
                }
                const log = dayLogs[exerciseName][setNum - 1];
                if (log.done) {
                    log.done = false;
                } else {
                    Object.assign(log, { weight, reps, done: true, cycle: st.currentCycle, week: st.currentWeek });
                }
            });
        }

        function updateWeight(exerciseName, setNum, value) {
            mutateState(st => {
                const dayLogs = getExerciseLogs(st, true);
                if (!dayLogs[exerciseName]) dayLogs[exerciseName] = [];
                while (dayLogs[exerciseName].length < setNum) {
                    dayLogs[exerciseName].push({ weight: 0, reps: '', done: false });
                }
                dayLogs[exerciseName][setNum - 1].weight = parseFloat(value) || 0;
            });
        }

        function updateReps(exerciseName, setNum, value) {
            mutateState(st => {
                const dayLogs = getExerciseLogs(st, true);
                if (!dayLogs[exerciseName]) dayLogs[exerciseName] = [];
                while (dayLogs[exerciseName].length < setNum) {
                    dayLogs[exerciseName].push({ weight: 0, reps: '', done: false });
                }
                dayLogs[exerciseName][setNum - 1].reps = value;
            });
        }

        function updateDayNote(value) {
            mutateState(st => {
                const { currentCycle: c, currentWeek: w, currentDay: d } = st;
                if (!st.dayNotes[c]) st.dayNotes[c] = {};
                if (!st.dayNotes[c][w]) st.dayNotes[c][w] = {};
                st.dayNotes[c][w][d] = value;
            });
        }

        function updateExerciseNote(exerciseName, value, inheritedNote) {
            const trimmed = value.trim();
            const inheritedTrimmed = (inheritedNote || '').trim();
            if (trimmed === '' && inheritedTrimmed === '') return;
            if (trimmed === inheritedTrimmed) return;
            mutateState(st => {
                const { currentCycle: c, currentWeek: w, currentDay: d } = st;
                if (!st.exerciseNotes[c]) st.exerciseNotes[c] = {};
                if (!st.exerciseNotes[c][w]) st.exerciseNotes[c][w] = {};
                if (!st.exerciseNotes[c][w][d]) st.exerciseNotes[c][w][d] = {};
                st.exerciseNotes[c][w][d][exerciseName] = value;
            });
        }

        function addSet(exerciseName) {
            mutateState(st => {
                const dayLogs = getExerciseLogs(st, true);
                if (!dayLogs[exerciseName]) dayLogs[exerciseName] = [];
                dayLogs[exerciseName].push({ weight: 0, reps: '', done: false });
            });
        }

        function removeSet(exerciseName, setNum) {
            mutateState(st => {
                const dayLogs = getExerciseLogs(st);
                if (dayLogs?.[exerciseName]?.[setNum - 1]) {
                    dayLogs[exerciseName].splice(setNum - 1, 1);
                }
            });
        }

        function finishWorkout() {
            const st = appState.value;
            const wasComplete = st.dayCompletion[st.currentCycle]?.[st.currentWeek]?.[st.currentDay];

            mutateState(st => {
                if (!st.dayCompletion[st.currentCycle]) st.dayCompletion[st.currentCycle] = {};
                if (!st.dayCompletion[st.currentCycle][st.currentWeek]) st.dayCompletion[st.currentCycle][st.currentWeek] = {};
                st.dayCompletion[st.currentCycle][st.currentWeek][st.currentDay] = true;
                if (!wasComplete && st.currentDay < 5) {
                    st.currentDay++;
                }
            });

            alert('Workout saved! Great job!');
        }

        function nextCycle() {
            if (appState.value.currentCycle >= 28) {
                alert('Maximum cycle reached!');
                return;
            }
            mutateState(st => {
                st.currentCycle++;
                st.currentDay = 1;
                st.currentWeek = 'A';
            });
        }

        // ── Components ───────────────────────────────────────────────

        function Header() {
            return html`
                <div class="header">
                    <span class="header-title">Claw Gains</span>
                    <button class="finish-btn" onClick=${finishWorkout}>Finish</button>
                </div>
            `;
        }

        function TimerBar() {
            const intervalRef = useRef(null);

            const startRest = useCallback((seconds) => {
                stopRest();
                timerRemaining.value = seconds;
                intervalRef.current = setInterval(() => {
                    timerRemaining.value--;
                    if (timerRemaining.value <= 0) {
                        playTimerBeep();
                        stopRest();
                    }
                }, 1000);
            }, []);

            const stopRest = useCallback(() => {
                if (intervalRef.current) {
                    clearInterval(intervalRef.current);
                    intervalRef.current = null;
                }
                timerRemaining.value = 0;
            }, []);

            useEffect(() => () => { if (intervalRef.current) clearInterval(intervalRef.current); }, []);

            const remaining = timerRemaining.value;
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            const display = `${mins}:${secs.toString().padStart(2, '0')}`;

            return html`
                <div class="timer-bar">
                    <span class="timer-display">${display}</span>
                    <button class="timer-btn" onClick=${() => startRest(60)}>60s</button>
                    <button class="timer-btn" onClick=${() => startRest(90)}>90s</button>
                    <button class="timer-btn" onClick=${() => startRest(120)}>2m</button>
                    <button class="timer-btn" onClick=${stopRest}>Stop</button>
                </div>
            `;
        }

        function WeekToggle() {
            const st = appState.value;
            const setWeek = (week) => mutateState(s => { s.currentWeek = week; });

            return html`
                <div class="week-toggle">
                    <button class="week-btn week-a ${st.currentWeek === 'A' ? 'active' : ''}"
                            onClick=${() => setWeek('A')}>Week A</button>
                    <button class="week-btn week-b ${st.currentWeek === 'B' ? 'active' : ''}"
                            onClick=${() => setWeek('B')}>Week B</button>
                </div>
            `;
        }

        function DayNav() {
            const st = appState.value;
            const dayNames = ['Lwr Qd', 'Up Push', 'Lwr PC', 'Up Pull', 'Arms/Mob'];

            return html`
                <div class="day-nav">
                    ${dayNames.map((name, i) => {
                        const day = i + 1;
                        const isCompleted = st.dayCompletion[st.currentCycle]?.[st.currentWeek]?.[day];
                        const isActive = st.currentDay === day;
                        return html`
                            <button class="day-btn ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}"
                                    onClick=${() => mutateState(s => { s.currentDay = day; })}
                                    key=${day}>
                                ${name}
                            </button>
                        `;
                    })}
                </div>
            `;
        }

        function SetRow({ exerciseName, set, isExtra, exLogs, prevSets, ex }) {
            const logData = exLogs[set - 1];
            const hasRealData = logData?.weight > 0 || logData?.reps || logData?.done;

            function getGhostForSet(setIndex) {
                for (let i = setIndex - 1; i >= 0; i--) {
                    const prev = exLogs[i];
                    if (prev && (prev.weight > 0 || prev.reps || prev.done)) {
                        return { weight: prev.weight || '', reps: prev.reps || '' };
                    }
                }
                if (prevSets) {
                    const matchingPrev = prevSets[setIndex];
                    if (matchingPrev && matchingPrev.weight > 0) return { weight: matchingPrev.weight || '', reps: matchingPrev.reps || '' };
                    const anyPrev = prevSets.find(s => s && s.weight > 0);
                    if (anyPrev) return { weight: anyPrev.weight || '', reps: anyPrev.reps || '' };
                }
                return null;
            }

            const ghost = getGhostForSet(set - 1);
            let weight, reps, done, ghostWeight, ghostReps;
            if (hasRealData) {
                weight = logData.weight || '';
                reps = logData.reps || '';
                done = logData.done || false;
                ghostWeight = '';
                ghostReps = '';
            } else {
                weight = '';
                reps = '';
                done = false;
                ghostWeight = ghost ? ghost.weight : '';
                ghostReps = ghost ? ghost.reps : '';
            }

            const prevSetData = prevSets ? prevSets[set - 1] : null;
            const prevDisplay = (prevSetData && prevSetData.done && prevSetData.weight > 0) ? `${prevSetData.weight}×${prevSetData.reps}` : '';

            return html`
                <tr>
                    <td class="set-num">${set}${isExtra ? '*' : ''}</td>
                    <td class="prev-val">${prevDisplay}</td>
                    <td><input type="number" class="kg-input" value=${weight}
                        onChange=${(e) => updateWeight(exerciseName, set, e.target.value)}
                        placeholder=${ghostWeight || '0'} step="1" min="0" /></td>
                    <td><input type="text" class="reps-input" value=${reps}
                        onChange=${(e) => updateReps(exerciseName, set, e.target.value)}
                        placeholder=${ghostReps || '0'} /></td>
                    <td>${isExtra ? html`<button class="remove-set-btn" onClick=${() => removeSet(exerciseName, set)}>✕</button>` : ''}</td>
                    <td class="check-col">
                        <div class="check-btn ${done ? 'checked' : ''}"
                             onClick=${(e) => toggleSet(exerciseName, set, e)}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                    </td>
                </tr>
            `;
        }

        function ExerciseRow({ ex, logs }) {
            const st = appState.value;
            if (!logs[ex.name]) logs[ex.name] = [];
            const exLogs = logs[ex.name];
            const prevSets = getPreviousWorkoutSets(ex.name);
            const actualSets = Math.max(ex.sets, exLogs.length);
            const note = ex.note ? `${ex.reps} · ${ex.note}` : ex.reps;
            const rawNote = st.exerciseNotes[st.currentCycle]?.[st.currentWeek]?.[st.currentDay]?.[ex.name];
            const hasOwnNote = rawNote !== undefined;
            const exNoteVal = rawNote || '';
            const inheritedNote = !hasOwnNote ? (getLastExerciseNote(ex.name) || '') : '';
            const isInherited = !hasOwnNote && inheritedNote !== '';

            const sets = [];
            for (let s = 1; s <= actualSets; s++) {
                sets.push(s);
            }

            return html`
                <div class="exercise-row">
                    <div class="exercise-info">
                        <div class="exercise-info-left">
                            <span class="exercise-name">${ex.name}</span>
                            <span class="exercise-note">${note}</span>
                            <input type="text"
                                class=${`exercise-note-input${isInherited ? ' inherited' : ''}`}
                                placeholder="Add note..."
                                value=${exNoteVal || inheritedNote}
                                onInput=${(e) => updateExerciseNote(ex.name, e.target.value, inheritedNote)} />
                        </div>
                        <span class="exercise-target">${ex.sets}×</span>
                    </div>
                    <table class="sets-table">
                        <thead><tr>
                            <th class="set-col">#</th>
                            <th class="prev-col">Prev</th>
                            <th class="kg-col">kg</th>
                            <th class="reps-col">${ex.metric === 'time' ? 'Time' : 'Reps'}</th>
                            <th class="remove-col"></th>
                            <th class="check-col"></th>
                        </tr></thead>
                        <tbody>
                            ${sets.map(s => html`
                                <${SetRow}
                                    key=${`${ex.name}-${s}`}
                                    exerciseName=${ex.name}
                                    set=${s}
                                    isExtra=${s > ex.sets}
                                    exLogs=${exLogs}
                                    prevSets=${prevSets}
                                    ex=${ex}
                                />
                            `)}
                        </tbody>
                    </table>
                    <button class="add-set-btn" onClick=${() => addSet(ex.name)}>+ Add Set</button>
                </div>
            `;
        }

        function ExerciseSection({ title, exercises, logs }) {
            if (!exercises || exercises.length === 0) return null;
            return html`
                <div class="group-card">
                    <div class="group-header">
                        <h3>${title}</h3>
                    </div>
                    ${exercises.map(ex => html`
                        <${ExerciseRow} key=${ex.name} ex=${ex} logs=${logs} />
                    `)}
                </div>
            `;
        }

        function History() {
            const history = getAllHistory();
            const entries = Object.entries(history);
            if (entries.length === 0) return null;

            return html`
                <div class="history-section">
                    <h2>Recent Progress</h2>
                    ${entries.slice(0, 5).map(([name, logs]) => {
                        const lastLog = logs[logs.length - 1];
                        return html`
                            <div class="history-item" key=${name}>
                                <span class="history-date">${name}</span>
                                <span>${lastLog.weight}kg × ${lastLog.reps} · C${lastLog.cycle}W${lastLog.week}</span>
                            </div>
                        `;
                    })}
                </div>
            `;
        }

        function WeekCompleteBanner() {
            return html`
                <div style="margin: 16px; padding: 16px; background: linear-gradient(135deg, var(--accent), #5856d6); border-radius: 12px; text-align: center; color: white;">
                    <h3 style="margin-bottom: 8px;">Week Complete!</h3>
                    <p style="font-size: 0.85rem; opacity: 0.9; margin-bottom: 8px;">Ready to start the next cycle?</p>
                    <button onClick=${nextCycle} style="background: white; color: var(--accent); border: none; padding: 8px 24px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;">Next Cycle</button>
                </div>
            `;
        }

        function DayNote() {
            const st = appState.value;
            const dayNoteVal = (st.dayNotes[st.currentCycle]?.[st.currentWeek]?.[st.currentDay]) || '';

            return html`
                <div class="day-note-wrap">
                    <textarea class="day-note-area" placeholder="Session notes..."
                        value=${dayNoteVal}
                        onChange=${(e) => updateDayNote(e.target.value)}></textarea>
                </div>
            `;
        }

        function WorkoutContent() {
            const pd = programData.value;
            if (!pd) return null;

            const st = appState.value;
            const dayData = pd[st.currentDay];
            invariant(dayData, `Missing day ${st.currentDay} in program data`);
            const exercises = getMainExercisesForWeek(dayData, st.currentWeek, `WorkoutContent day=${st.currentDay}`);
            const logs = st.exerciseLogs[st.currentCycle]?.[st.currentWeek]?.[st.currentDay] || {};

            const filterWeekB = (arr) => arr ? arr.filter(ex => !ex.isWeekB || st.currentWeek === 'B') : [];

            const completedDays = (() => {
                const weekData = st.dayCompletion[st.currentCycle]?.[st.currentWeek] || {};
                return Object.values(weekData).filter(Boolean).length;
            })();

            return html`
                <div id="workoutContent">
                    <h2>${dayData.name}</h2>
                    <${DayNote} />
                    <${ExerciseSection} title="Warm-up" exercises=${dayData.warmup} logs=${logs} />
                    <${ExerciseSection} title="Main Work" exercises=${exercises} logs=${logs} />
                    ${dayData.prehab ? html`<${ExerciseSection} title="Prehab" exercises=${filterWeekB(dayData.prehab)} logs=${logs} />` : null}
                    ${dayData.accessories ? html`<${ExerciseSection} title="Accessories" exercises=${filterWeekB(dayData.accessories)} logs=${logs} />` : null}
                    ${dayData.shoulderHealth ? html`<${ExerciseSection} title="Shoulder Health" exercises=${filterWeekB(dayData.shoulderHealth)} logs=${logs} />` : null}
                    ${dayData.calfTibialis ? html`<${ExerciseSection} title="Calf/Tibialis" exercises=${filterWeekB(dayData.calfTibialis)} logs=${logs} />` : null}
                    ${dayData.neck ? html`<${ExerciseSection} title="Neck" exercises=${filterWeekB(dayData.neck)} logs=${logs} />` : null}
                    ${dayData.flexibility ? html`<${ExerciseSection} title="Flexibility" exercises=${filterWeekB(dayData.flexibility)} logs=${logs} />` : null}
                    <${ExerciseSection} title="Extra Time" exercises=${filterWeekB(dayData.extra)} logs=${logs} />
                    ${completedDays === 5 ? html`<${WeekCompleteBanner} />` : null}
                    <${History} />
                </div>
            `;
        }

        function App() {
            return html`
                <${Header} />
                <${TimerBar} />
                <div id="mainView">
                    <${WeekToggle} />
                    <${DayNav} />
                    <${WorkoutContent} />
                </div>
            `;
        }

        // ── Bootstrap ────────────────────────────────────────────────

        async function init() {
            const resp = await fetch('/program.json');
            programData.value = await resp.json();
            render(html`<${App} />`, document.getElementById('app'));
        }

        init();
    </script>
</body>
</html>
