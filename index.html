<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claw Gains - Strength Tracker</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Claw Gains">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app"></div>
    <div id="bootFallback" style="position:fixed;inset:0;z-index:99999;padding:16px;color:#ff8a8a;font-family:system-ui;background:#000;">
        Loading Claw Gains… If this stays blank for more than 10 seconds, refresh once.
    </div>

    <script>
        // Bootstrap watchdog: inline so it runs even if app.js fails to load.
        window.__clawgainsBooted = false;
        window.__clawgainsBootTimer = setTimeout(() => {
            if (window.__clawgainsBooted) return;
            // Write into the boot overlay: it sits on top of #app until boot succeeds.
            const overlay = document.getElementById('bootFallback');
            if (overlay) {
                overlay.innerHTML = `
                    <div style="font-weight:600;margin-bottom:8px">Claw Gains failed to load</div>
                    <div style="margin-bottom:8px">Please refresh once. If it keeps happening, the app resources may be blocked or stale.</div>`;
            }
            try {
                const payload = JSON.stringify({
                    kind: 'bootstrap.timeout',
                    href: location.href,
                    readyState: document.readyState,
                    online: navigator.onLine,
                    ua: navigator.userAgent,
                    ts: new Date().toISOString(),
                });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('/api/client-error', new Blob([payload], { type: 'application/json' }));
                } else {
                    fetch('/api/client-error', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: payload,
                    }).catch(() => {});
                }
            } catch {}
        }, 7000);
    </script>

    <script type="module" src="/app.js"></script>

    <script>
        // Offline support. Requires a secure context (HTTPS or localhost);
        // on plain http this rejects and the app behaves exactly as before.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
